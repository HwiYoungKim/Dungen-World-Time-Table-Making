<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>모임 일정 조율</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header>
  <div class="header-inner">
    <h1 id="app-title">📅 모임 일정 조율</h1>
    <div class="header-actions">
      <button id="btn-save" class="btn btn-ghost" title="변경 사항을 서버에 바로 업로드합니다" disabled>💾 저장됨</button>
      <button id="btn-reload" class="btn btn-ghost" title="다른 사람이 업데이트한 내용을 다시 불러옵니다">🔄 새로고침</button>
      <button id="btn-theme" class="btn btn-ghost" title="테마 전환">🌓</button>
    </div>
  </div>
</header>

<main id="app"></main>

<div id="sync-status" hidden></div>

<footer>
  <p>데이터는 서버에 자동 동기화되고 GitHub 저장소에 주기적으로 백업됩니다. 브라우저(localStorage)에도 사본이 저장됩니다.</p>
</footer>

<input type="file" id="file-import" accept=".json,application/json" hidden>
<script src="app.js?v=3"></script>
</body>
</html>
