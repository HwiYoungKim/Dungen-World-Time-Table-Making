<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>모임 일정 조율</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <h1 id="app-title">📅 모임 일정 조율</h1>
    <div class="header-actions">
      <button id="btn-reload" class="btn btn-ghost" title="다른 사람이 업데이트한 내용을 다시 불러옵니다">🔄 새로고침</button>
      <button id="btn-theme" class="btn btn-ghost" title="테마 전환">🌓</button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <p>데이터는 이 브라우저의 localStorage에 자동 저장됩니다. 다른 사람과 합치려면 각 일정의 [공유/설정] 탭에서 JSON 내보내기/가져오기를 사용하세요.</p>
</footer>

<input type="file" id="file-import" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
