name: 일정 데이터 장기 백업

on:
  schedule:
    # 6시간마다 임시 서버의 일정 데이터를 저장소에 백업
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 동기화 데이터 내려받기
        run: |
          set -euo pipefail
          API=$(jq -r .api data/sync-registry.json)
          REGISTRY_ID=$(jq -r .registryId data/sync-registry.json)
          mkdir -p data/backups

          if ! curl -sf "$API/$REGISTRY_ID" -o /tmp/registry.json; then
            echo "::warning::레지스트리를 불러오지 못했습니다. 이번 백업을 건너뜁니다."
            exit 0
          fi

          jq -r '.data.codes[]?' /tmp/registry.json | while read -r code; do
            [ -z "$code" ] && continue
            if curl -sf "$API/$code" -o /tmp/obj.json; then
              if jq -e '.data.participants | type == "array"' /tmp/obj.json > /dev/null; then
                jq '.data' /tmp/obj.json > "data/backups/$code.json"
                echo "백업 완료: $code"
              else
                echo "::warning::$code 는 일정 데이터가 아니어서 건너뜁니다."
              fi
            else
              echo "::warning::$code 를 서버에서 불러오지 못했습니다 (기존 백업 유지)."
            fi
          done

      - name: 변경 사항 커밋
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backups
          if git diff --cached --quiet; then
            echo "변경 사항이 없습니다."
          else
            git commit -m "자동 백업: 일정 동기화 데이터 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
